; Farbmischer Firmware, ESP32 DevKit, Arduino-Framework.
; Bauen:    pio run
; Flashen:  pio run -t upload
; Webseite: ./sync_web.sh && pio run -t uploadfs
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
