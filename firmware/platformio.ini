; Farbmischer Firmware (Stand 8), ESP32 DevKit, Arduino-Framework.
; Bauen:    pio run
; Flashen:  pio run -t upload
; Webseite: ./sync_web.sh && pio run -t uploadfs
; Host-Test der Rechenfunktionen (ohne Arduino):
;   g++ -std=c++17 test/test_dosing.cpp -Iinclude -o /tmp/test_dosing && /tmp/test_dosing
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    bogde/HX711@^0.7.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
; test/ enthält nur den Host-Test, nicht in die Firmware aufnehmen.
test_ignore = *
